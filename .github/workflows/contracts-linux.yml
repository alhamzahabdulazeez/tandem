name: Contracts & Environment Probe (Linux)

on:
  push:
    branches:
      - wip-t01-contracts
      - main
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run repository audit
        run: node bin/audit.cjs

      - name: Run test suite
        run: node test/all.cjs

  probe:
    name: Environment Probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run probe and collect diagnostics
        run: |
          {
            echo "=== SYSTEM (uname -a) ==="
            uname -a
            echo ""

            echo "=== NODE (node -v) ==="
            node -v
            which node
            echo ""

            echo "=== BWRAP ==="
            if command -v bwrap >/dev/null 2>&1; then
              echo "Path: $(which bwrap)"
              bwrap --version || true
              if bwrap --ro-bind / / --dev /dev --proc /proc true 2>&1; then
                echo "Status: AVAILABLE (execution succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== UNSHARE -Urm ==="
            if command -v unshare >/dev/null 2>&1; then
              echo "Path: $(which unshare)"
              unshare --version || true
              if unshare -Urm id 2>&1; then
                echo "Status: AVAILABLE (unshare -Urm succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== CGROUP V2 CONTROLLERS ==="
            if [ -d "/sys/fs/cgroup" ]; then
              echo "Mount type: $(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unknown)"
              if [ -f "/sys/fs/cgroup/cgroup.controllers" ]; then
                echo "Status: AVAILABLE"
                echo "Controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
                echo "Subtree Control: $(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo none)"
              else
                echo "Status: NOT AVAILABLE (cgroup.controllers missing)"
              fi
            else
              echo "Status: NOT MOUNTED"
            fi
            echo ""

            echo "=== PID NAMESPACES ==="
            if command -v unshare >/dev/null 2>&1; then
              if unshare -Urpf --mount-proc sh -c 'ps -ef' 2>&1; then
                echo "Status: AVAILABLE (unprivileged PID namespace succeeded)"
              elif unshare -p -f true 2>&1; then
                echo "Status: AVAILABLE (privileged PID namespace succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== SECCOMP ==="
            grep -i Seccomp /proc/self/status || true
            if dpkg -s libseccomp2 >/dev/null 2>&1; then
              dpkg -s libseccomp2 | grep -E 'Package|Version|Status' || true
              echo "Status: AVAILABLE"
            elif [ -f "/proc/sys/kernel/seccomp/actions_avail" ]; then
              echo "Actions available: $(cat /proc/sys/kernel/seccomp/actions_avail)"
              echo "Status: AVAILABLE"
            else
              echo "Status: UNKNOWN / NOT DETECTED"
            fi
            echo ""
          } | tee probe-output.txt

      - name: Upload probe output artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-output.txt

  containment:
    name: Docker Containment Proof
    runs-on: ubuntu-24.04
    steps:
      - name: Run Docker containment proof
        run: |
          set -euo pipefail
          {
            echo "=== 1. FULL CONTAINER CONTAINMENT ==="
            docker run --rm --network=none --pids-limit=64 --memory=512m --read-only --tmpfs /tmp alpine:3 sh -c 'id; ps -ef | wc -l; wget -T3 -q -O- http://example.com; echo net_exit=$?'
            echo ""

            echo "=== 2. PID ISOLATION PROOF ==="
            PID_COUNT=$(docker run --rm --network=none alpine:3 sh -c 'ps -ef | wc -l')
            echo "PID Count: $PID_COUNT"
            if [ "$PID_COUNT" -ge 10 ]; then
              echo "ERROR: PID count $PID_COUNT is not under 10 (PID isolation failed)"
              exit 1
            fi
            echo "PID isolation OK (count < 10)"
            echo ""

            echo "=== 3. MEMORY LIMIT PROOF ==="
            docker run --rm --memory=64m alpine:3 sh -c 'echo mem ok'
            echo ""

            echo "=== 4. NETWORK ISOLATION ASSERTION ==="
            if docker run --rm --network=none alpine:3 wget -T3 -q -O- http://example.com >/dev/null 2>&1; then
              echo "ERROR: Network access succeeded inside --network=none (Network isolation failed)"
              exit 1
            else
              echo "Network isolation OK (network unreachable with --network=none)"
            fi
            echo ""
          } | tee containment-docker.txt

          if grep -q "ERROR:" containment-docker.txt; then
            echo "Docker containment proof failed: ERROR detected in evidence output."
            exit 1
          fi

      - name: Upload Docker containment artifact
        uses: actions/upload-artifact@v4
        with:
          name: containment-docker
          path: containment-docker.txt

  ceilings:
    name: Runtime Ceilings Enforcement Proof
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run runtime ceilings enforcement proof
        run: |
          set -euo pipefail
          {
            echo "================================================================================"
            echo "IB-03 RUNTIME CEILINGS ENFORCEMENT PROOF"
            echo "Platform: $(uname -s) $(uname -r) $(uname -m)"
            echo "Date: $(date -u)"
            echo "================================================================================"
            echo ""

            echo "=== 1. TIME CEILING ENFORCEMENT PROOF ==="
            echo "Testing: docker run --rm alpine:3 sh -c 'sleep 600' with 480s timeout"
            START_TIME=$(date +%s)
            set +e
            timeout --kill-after=10s 480s docker run --rm alpine:3 sh -c 'sleep 600'
            TIME_EXIT=$?
            set -e
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))
            echo "Observed exit code: $TIME_EXIT"
            echo "Elapsed wall-clock time: ${ELAPSED}s"
            if [ "$TIME_EXIT" -ne 124 ] && [ "$TIME_EXIT" -ne 137 ] && [ "$TIME_EXIT" -ne 143 ]; then
              echo "ERROR: Time ceiling 480s not enforced (exit code $TIME_EXIT)"
              exit 1
            fi
            if [ "$ELAPSED" -lt 470 ]; then
              echo "ERROR: Process terminated prematurely before ceiling (${ELAPSED}s < 480s)"
              exit 1
            fi
            echo "Time ceiling enforcement OK: process killed at 480s ceiling with exit code $TIME_EXIT"
            echo ""

            echo "=== 2. PROCESS / PID CEILING ENFORCEMENT PROOF ==="
            echo "Testing: docker run --rm --pids-limit=20 alpine:3 sh -c 'for i in \$(seq 1 40); do sleep 30 & done; wait'"
            set +e
            PIDS_OUT=$(docker run --rm --pids-limit=20 alpine:3 sh -c 'for i in $(seq 1 40); do sleep 30 & done; wait' 2>&1)
            PIDS_EXIT=$?
            set -e
            echo "$PIDS_OUT"
            echo "Observed exit code: $PIDS_EXIT"
            if echo "$PIDS_OUT" | grep -qi -E "fork|temporarily unavailable|Resource|resource"; then
              echo "Process ceiling enforcement OK: fork failure observed at pids-limit=20 ceiling"
            else
              echo "ERROR: Process limit was not enforced (no fork failure detected in output)"
              exit 1
            fi
            echo ""

            echo "=== 3. MEMORY CEILING ENFORCEMENT PROOF ==="
            echo "Testing: docker run --rm --memory=64m --memory-swap=64m alpine:3 sh -c 'tail /dev/zero'"
            set +e
            MEM_OUT=$(docker run --rm --memory=64m --memory-swap=64m alpine:3 sh -c 'tail /dev/zero' 2>&1)
            MEM_EXIT=$?
            set -e
            echo "$MEM_OUT"
            echo "Observed exit code: $MEM_EXIT"

            CID=$(docker create --memory=64m --memory-swap=64m alpine:3 sh -c 'tail /dev/zero')
            set +e
            docker start -a "$CID" >/dev/null 2>&1
            INSPECT_EXIT=$?
            set -e
            OOM_STATUS=$(docker inspect "$CID" --format '{{.State.OOMKilled}}' 2>/dev/null || echo "unknown")
            INSPECT_CODE=$(docker inspect "$CID" --format '{{.State.ExitCode}}' 2>/dev/null || echo "$INSPECT_EXIT")
            docker rm "$CID" >/dev/null 2>&1 || true
            echo "Docker inspect OOMKilled flag: $OOM_STATUS"
            echo "Docker inspect ExitCode: $INSPECT_CODE"

            if [ "$MEM_EXIT" -ne 137 ] && [ "$OOM_STATUS" != "true" ]; then
              echo "ERROR: Memory ceiling 64m not OOM-killed (expected exit code 137 or OOMKilled=true, observed exit code $MEM_EXIT, OOMKilled=$OOM_STATUS)"
              exit 1
            fi
            echo "Memory ceiling enforcement OK: process OOM-killed (exit code $MEM_EXIT / SIGKILL, OOMKilled=$OOM_STATUS)"
            echo ""

            echo "=== 4. RESERVE POLICY ARITHMETIC (NOT ENFORCEMENT) ==="
            node -e '
            const ceilings = [
              { name: "Wall-Clock Time", total: 480, unit: "s" },
              { name: "Files Read", total: 40, unit: "files" },
              { name: "Files Changed", total: 12, unit: "files" },
              { name: "Changed Lines", total: 600, unit: "lines" },
              { name: "Tool Calls", total: 20, unit: "calls" },
            ];
            const RESERVE_PCT = 0.20;
            console.log("Computing 20% mandatory reserve policy arithmetic across all bounded dimensions:");
            console.log("--------------------------------------------------------------------------------");
            console.log(String("Dimension").padEnd(25) + String("Total Ceiling").padEnd(16) + String("Effective (80%)").padEnd(18) + String("Reserved (20%)").padEnd(16) + "Status");
            console.log("--------------------------------------------------------------------------------");
            let allValid = true;
            for (const c of ceilings) {
              const reserved = Math.round(c.total * RESERVE_PCT * 100) / 100;
              const effective = Math.round((c.total - reserved) * 100) / 100;
              const calculatedReservePct = reserved / c.total;
              const valid = Math.abs(calculatedReservePct - RESERVE_PCT) < 0.0001 && (effective + reserved === c.total);
              if (!valid) allValid = false;
              console.log(
                c.name.padEnd(25) +
                `${c.total} ${c.unit}`.padEnd(16) +
                `${effective} ${c.unit}`.padEnd(18) +
                `${reserved} ${c.unit}`.padEnd(16) +
                (valid ? "COMPUTED" : "FAILED")
              );
            }
            console.log("--------------------------------------------------------------------------------");
            if (!allValid) {
              console.error("ERROR: Reserve calculation assertion failed!");
              process.exit(1);
            }
            console.log("Reserve policy arithmetic OK: 20% computed buffer across all dimensions.");
            '
            echo "NOTE: Files-read, files-changed, changed-lines, and tool-call ceilings have no runtime enforcement in Tandem today; only wall-clock time, process count, and memory are enforced by the container runtime."
            echo ""
          } | tee ceilings-evidence.txt

          if grep -q "ERROR:" ceilings-evidence.txt; then
            echo "Ceilings enforcement proof failed: ERROR detected in evidence output."
            exit 1
          fi

      - name: Upload ceilings evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceilings-evidence
          path: ceilings-evidence.txt

  isolated:
    name: Run Test Suite in Isolated Container
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and bubblewrap
        run: |
          apt-get update
          apt-get install -y bubblewrap
          bwrap --version
          npm ci

      - name: Containment proof
        run: |
          {
            echo "=== 1. PID Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid sh -c 'ps -ef | wc -l' 2>&1 || true
            echo ""

            echo "=== 2. Network Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net sh -c 'getent hosts github.com; echo exit=$?' 2>&1 || true
            echo ""

            echo "=== 3. Full Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all sh -c 'id; ls /proc | head -5' 2>&1 || true
            echo ""
          } | tee containment-probe.txt

      - name: Upload containment probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: containment-probe
          path: containment-probe.txt

      - name: Run repository audit
        run: node bin/audit.cjs

      - name: Run test suite
        run: node test/all.cjs
