name: Contracts & Environment Probe (Linux)

on:
  push:
    branches:
      - wip-t01-contracts
      - main
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: node test/all.cjs

  probe:
    name: Environment Probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run probe and collect diagnostics
        run: |
          {
            echo "=== SYSTEM (uname -a) ==="
            uname -a
            echo ""

            echo "=== NODE (node -v) ==="
            node -v
            which node
            echo ""

            echo "=== BWRAP ==="
            if command -v bwrap >/dev/null 2>&1; then
              echo "Path: $(which bwrap)"
              bwrap --version || true
              if bwrap --ro-bind / / --dev /dev --proc /proc true 2>&1; then
                echo "Status: AVAILABLE (execution succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== UNSHARE -Urm ==="
            if command -v unshare >/dev/null 2>&1; then
              echo "Path: $(which unshare)"
              unshare --version || true
              if unshare -Urm id 2>&1; then
                echo "Status: AVAILABLE (unshare -Urm succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== CGROUP V2 CONTROLLERS ==="
            if [ -d "/sys/fs/cgroup" ]; then
              echo "Mount type: $(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unknown)"
              if [ -f "/sys/fs/cgroup/cgroup.controllers" ]; then
                echo "Status: AVAILABLE"
                echo "Controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
                echo "Subtree Control: $(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo none)"
              else
                echo "Status: NOT AVAILABLE (cgroup.controllers missing)"
              fi
            else
              echo "Status: NOT MOUNTED"
            fi
            echo ""

            echo "=== PID NAMESPACES ==="
            if command -v unshare >/dev/null 2>&1; then
              if unshare -Urpf --mount-proc sh -c 'ps -ef' 2>&1; then
                echo "Status: AVAILABLE (unprivileged PID namespace succeeded)"
              elif unshare -p -f true 2>&1; then
                echo "Status: AVAILABLE (privileged PID namespace succeeded)"
              else
                echo "Status: EXECUTION_FAILED"
              fi
            else
              echo "Status: NOT INSTALLED"
            fi
            echo ""

            echo "=== SECCOMP ==="
            grep -i Seccomp /proc/self/status || true
            if dpkg -s libseccomp2 >/dev/null 2>&1; then
              dpkg -s libseccomp2 | grep -E 'Package|Version|Status' || true
              echo "Status: AVAILABLE"
            elif [ -f "/proc/sys/kernel/seccomp/actions_avail" ]; then
              echo "Actions available: $(cat /proc/sys/kernel/seccomp/actions_avail)"
              echo "Status: AVAILABLE"
            else
              echo "Status: UNKNOWN / NOT DETECTED"
            fi
            echo ""
          } | tee probe-output.txt

      - name: Upload probe output artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-output.txt

  containment:
    name: Docker Containment Proof
    runs-on: ubuntu-24.04
    steps:
      - name: Run Docker containment proof
        run: |
          {
            echo "=== 1. FULL CONTAINER CONTAINMENT ==="
            docker run --rm --network=none --pids-limit=64 --memory=512m --read-only --tmpfs /tmp alpine:3 sh -c 'id; ps -ef | wc -l; wget -T3 -q -O- http://example.com; echo net_exit=$?'
            echo ""

            echo "=== 2. PID ISOLATION PROOF ==="
            PID_COUNT=$(docker run --rm --network=none alpine:3 sh -c 'ps -ef | wc -l')
            echo "PID Count: $PID_COUNT"
            if [ "$PID_COUNT" -ge 10 ]; then
              echo "ERROR: PID count $PID_COUNT is not under 10 (PID isolation failed)"
              exit 1
            fi
            echo "PID isolation OK (count < 10)"
            echo ""

            echo "=== 3. MEMORY LIMIT PROOF ==="
            docker run --rm --memory=64m alpine:3 sh -c 'echo mem ok'
            echo ""

            echo "=== 4. NETWORK ISOLATION ASSERTION ==="
            if docker run --rm --network=none alpine:3 wget -T3 -q -O- http://example.com >/dev/null 2>&1; then
              echo "ERROR: Network access succeeded inside --network=none (Network isolation failed)"
              exit 1
            else
              echo "Network isolation OK (network unreachable with --network=none)"
            fi
            echo ""
          } | tee containment-docker.txt

      - name: Upload Docker containment artifact
        uses: actions/upload-artifact@v4
        with:
          name: containment-docker
          path: containment-docker.txt

  isolated:
    name: Run Test Suite in Isolated Container
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and bubblewrap
        run: |
          apt-get update
          apt-get install -y bubblewrap
          bwrap --version
          npm ci

      - name: Containment proof
        run: |
          {
            echo "=== 1. PID Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid sh -c 'ps -ef | wc -l' 2>&1 || true
            echo ""

            echo "=== 2. Network Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net sh -c 'getent hosts github.com; echo exit=$?' 2>&1 || true
            echo ""

            echo "=== 3. Full Isolation ==="
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all sh -c 'id; ls /proc | head -5' 2>&1 || true
            echo ""
          } | tee containment-probe.txt

      - name: Upload containment probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: containment-probe
          path: containment-probe.txt

      - name: Run test suite
        run: node test/all.cjs
